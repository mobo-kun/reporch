name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Installer syntax
        run: bash -n install.sh
  browser:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Demo end to end (build, PDF, QA with browser checks)
        run: |
          python tools/make_demo.py
          P=examples/demo/basket-checkout
          python scripts/reporch.py build "$P" --markdown
          python scripts/reporch.py pdf "$P"
          python scripts/reporch.py qa "$P"
