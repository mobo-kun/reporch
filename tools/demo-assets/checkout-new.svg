<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="Vazirmatn, system-ui, sans-serif">
  <title>Fictional mockup: redesigned Basket checkout on mobile</title>
  <rect width="360" height="640" fill="#EEF8F5"/>
  <rect x="40" y="20" width="280" height="600" rx="34" fill="#1C1B22"/>
  <rect x="52" y="32" width="256" height="576" rx="24" fill="#FFFFFF"/>
  <rect x="140" y="40" width="80" height="8" rx="4" fill="#1C1B22"/>
  <text x="72" y="84" font-size="17" font-weight="800" fill="#1C1B22">Checkout</text>
  <text x="72" y="104" font-size="10" fill="#6B6B76">Basket · 4 items · 12.80</text>
  <text x="72" y="134" font-size="12" font-weight="700" fill="#1C1B22">Delivery</text>
  <g font-size="10">
    <rect x="68" y="144" width="68" height="30" rx="6" fill="#754EC6"/><text x="80" y="163" fill="#FFFFFF">10–12</text>
    <rect x="146" y="144" width="68" height="30" rx="6" fill="#FFFFFF" stroke="#754EC6"/><text x="158" y="163" fill="#503587">12–14</text>
    <rect x="224" y="144" width="68" height="30" rx="6" fill="#F7F7F8"/><text x="236" y="163" fill="#9C9CA5">full</text>
  </g>
  <text x="72" y="204" font-size="12" font-weight="700" fill="#1C1B22">Discount code</text>
  <rect x="68" y="214" width="156" height="36" rx="8" fill="#FFFFFF" stroke="#754EC6" stroke-width="1.5"/>
  <text x="80" y="237" font-size="11" fill="#9C9CA5">Enter code</text>
  <rect x="232" y="214" width="60" height="36" rx="8" fill="#E9E3F6"/><text x="262" y="237" font-size="11" font-weight="700" fill="#503587" text-anchor="middle">Apply</text>
  <text x="72" y="282" font-size="12" font-weight="700" fill="#1C1B22">Payment</text>
  <rect x="68" y="292" width="224" height="40" rx="8" fill="#F7F7F8"/><text x="80" y="316" font-size="11" fill="#1C1B22">Card •••• 4242</text>
  <g font-size="11" fill="#1C1B22">
    <rect x="68" y="342" width="224" height="40" rx="8" fill="#F7F7F8"/><text x="80" y="366">Milk 1 L</text><text x="252" y="366">2.40</text>
    <rect x="68" y="388" width="224" height="40" rx="8" fill="#F7F7F8"/><text x="80" y="412">Bread</text><text x="252" y="412">1.90</text>
  </g>
  <rect x="52" y="540" width="256" height="68" fill="#FFFFFF"/>
  <line x1="52" y1="540" x2="308" y2="540" stroke="#E2E2E6"/>
  <rect x="68" y="552" width="224" height="44" rx="12" fill="#754EC6"/>
  <text x="180" y="579" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pay 12.80</text>
  <text x="180" y="636" font-size="9" fill="#6B6B76" text-anchor="middle">Fictional demo mockup · Pay button pinned</text>
</svg>
